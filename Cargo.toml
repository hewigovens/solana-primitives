[workspace]
members = ["solana-primitives"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
readme = "README.md"
description = "Fundamental data structures and tools needed to construct and submit Solana transactions."
repository = "https://github.com/hewigovens/solana-primitives"
homepage = "https://github.com/hewigovens/solana-primitives"
documentation = "https://docs.rs/solana-primitives"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1


[workspace.dependencies]
ed25519-dalek = "3.0"
curve25519-dalek = { version = "5.0", default-features = false }
bs58 = "0.5"
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
borsh = { version = "1.6", features = ["derive"] }
base64 = "0.22"
hexlit = "0.5"
serde_json = "1.0"
