[package]
name = "solana-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
default = ["signing"]
# Ed25519 key derivation, signing, and signature verification.
signing = ["dep:ed25519-dalek"]
# Serde support for the Rust data model (not the transaction wire format).
serde = ["dep:serde"]
# Borsh support for `Pubkey` and `SignatureBytes` (not the transaction wire format).
borsh = ["dep:borsh"]

[dependencies]
bs58.workspace = true
curve25519-dalek.workspace = true
sha2.workspace = true
ed25519-dalek = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
borsh = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
hexlit.workspace = true
serde_json.workspace = true

[[example]]
name = "basic"
required-features = ["signing"]

[package.metadata.docs.rs]
all-features = true
